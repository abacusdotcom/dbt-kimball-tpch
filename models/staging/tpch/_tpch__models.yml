version: 2

models:
  - name: stg_tpch__customer
    description: One row per customer, current state, renamed columns.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_tpch__orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch__customer')
                field: customer_id
  - name: stg_tpch__lineitem
    description: One row per order line.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [order_id, line_number]
  - name: stg_tpch__part
    columns:
      - name: part_id
        data_tests: [unique, not_null]
  - name: stg_tpch__supplier
    columns:
      - name: supplier_id
        data_tests: [unique, not_null]
  - name: stg_tpch__nation
    columns:
      - name: nation_id
        data_tests: [unique, not_null]
